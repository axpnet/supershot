name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config libglib2.0-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb package
        run: |
          cp target/release/supershot pkg-deb/usr/bin/supershot
          chmod 755 pkg-deb/usr/bin/supershot
          dpkg-deb --build pkg-deb "supershot_${{ steps.version.outputs.version }}_amd64.deb"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: supershot_${{ steps.version.outputs.version }}_amd64.deb
          generate_release_notes: true
