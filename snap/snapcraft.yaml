name: supershot
version: '1.3.0'
title: SuperShot
summary: Capture, annotate and share screenshots on any Linux desktop
description: |
  SuperShot is a native GTK4/Libadwaita screenshot tool for Linux desktops.

  Captures go through the XDG Desktop Portal on both Wayland and X11, so it
  works on GNOME, KDE Plasma, and any compositor that ships a portal backend.

  Features:
  - Annotation toolbar: arrow, rectangle, ellipse, highlighter, free draw,
    text labels and numbered step markers, with an eight-colour palette
  - Pixelate and blackout redaction that destroys the underlying pixels
    rather than covering them, so nothing sensitive survives in the file
  - Crop with live selection, and undo/redo across the whole session
  - Image editor: rotate, flip, brightness, contrast, blur, sharpen,
    grayscale, invert
  - Customisable watermark: 5 date formats, custom text, 4 corners, colour
  - Capture modes: ask, area, window, whole screen
  - Configurable delay (none, 3, 5, 10 seconds) with visual countdown
  - PNG and JPEG output with adjustable quality
  - Copy the annotated image straight to the clipboard, no file needed
  - Clickable desktop notifications
  - CLI headless mode: supershot --now --mode area
  - 14 language translations

grade: stable
confinement: strict
base: core24
license: GPL-3.0-or-later

contact: https://github.com/axpnet/supershot/issues
issues: https://github.com/axpnet/supershot/issues
source-code: https://github.com/axpnet/supershot
website: https://github.com/axpnet/supershot

icon: data/icons/hicolor/scalable/apps/com.github.axpnet.SuperShot.svg

# Every architecture the Snap Store already publishes for. Declaring a subset
# here would strand the omitted ones on whatever revision they last received:
# armhf and riscv64 have no .deb or AppImage to fall back on, the snap is their
# only channel. rustup provides native host toolchains for all four.
platforms:
  amd64:
  arm64:
  armhf:
  riscv64:

apps:
  supershot:
    command: usr/bin/supershot
    common-id: com.github.axpnet.SuperShot
    desktop: usr/share/applications/com.github.axpnet.SuperShot.desktop
    extensions: [gnome]
    plugs:
      - home
      - desktop
      - desktop-legacy
      - wayland
      - x11
      # Screenshots are frequently saved to an external drive or a mounted
      # network share; without this the folder picker can select a location
      # the app is then denied write access to.
      - removable-media

parts:
  # The Rust toolchain, fetched over HTTPS.
  #
  # Neither of the obvious routes works inside a build container. `plugin: rust`
  # requires the `rustup` *snap*, which is classic and cannot be installed
  # there: the part fails validation with "'rustup' not found", identically
  # under LXD and on Launchpad. And the archive toolchain tops out at
  # rustc 1.91, while gtk4-sys 0.11.4 and the pango crates require 1.92.
  #
  # rustup's install script needs nothing but curl and honours the HTTP proxy
  # Launchpad builders set, so it works in both environments. The prefix is
  # absolute because the next part runs in the same container but a different
  # working directory.
  rust-deps:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
      - gcc
    override-build: |
      set -eu
      export RUSTUP_HOME=/opt/rust/rustup
      export CARGO_HOME=/opt/rust/cargo
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
      /opt/rust/cargo/bin/rustc --version
    # Build-time only; nothing from this part belongs in the snap.
    prime:
      - -*

  supershot:
    after: [rust-deps]
    plugin: nil
    source: .
    build-packages:
      - libgtk-4-dev
      - libadwaita-1-dev
      - pkg-config
      - libglib2.0-dev
      # msgfmt, for compiling the translation catalogs.
      - gettext
    stage-packages:
      - libgtk-4-1
      - libadwaita-1-0
      - liblcms2-2
    override-build: |
      set -eu
      export RUSTUP_HOME=/opt/rust/rustup
      export CARGO_HOME=/opt/rust/cargo
      export PATH="/opt/rust/cargo/bin:$PATH"

      cargo build --release --locked

      # Install through the same script the .deb and AppImage builds use, so the
      # three cannot disagree about what a complete installation contains. That
      # divergence is what left every channel shipping zero translation
      # catalogs before 1.3.0.
      ./scripts/install.sh "$CRAFT_PART_INSTALL"

      glib-compile-schemas "$CRAFT_PART_INSTALL/usr/share/glib-2.0/schemas/"
    parse-info: [usr/share/metainfo/com.github.axpnet.SuperShot.metainfo.xml]
