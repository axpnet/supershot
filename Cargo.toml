[package]
name = "supershot"
version = "1.0.0"
edition = "2021"
authors = ["axpnet <axp@pm.me>"]
description = "A native GTK4/Libadwaita screenshot tool for GNOME with delay timer."
license = "GPL-3.0-or-later"
repository = "https://github.com/axpnet/supershot"
keywords = ["screenshot", "gtk4", "libadwaita", "rust", "gnome"]
categories = ["gui", "multimedia"]

[dependencies]
gtk4 = { version = "0.10", package = "gtk4" }
libadwaita = { version = "0.8", features = ["v1_5"] }
ashpd = { version = "0.12", features = ["gtk4_wayland", "gtk4_x11"] }
chrono = "0.4"
dirs = "6.0"
gettext-rs = "0.7"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
