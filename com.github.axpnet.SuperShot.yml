app-id: com.github.axpnet.SuperShot
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: supershot

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

  # Screenshots are taken through the portal, which needs the Desktop bus name.
  # The individual portal interfaces are not separate bus names, so the old
  # --talk-name=org.freedesktop.portal.Screenshot entry never matched anything.
  - --talk-name=org.freedesktop.portal.Desktop

  # Without a filesystem permission the app cannot write the screenshot it just
  # captured: ~/Pictures is outside the sandbox. xdg-pictures covers the default
  # location; a directory chosen through the file chooser portal is granted
  # separately by the document portal.
  - --filesystem=xdg-pictures/Screenshots:create

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/supershot/cargo
    CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/doc
  - '*.a'
  - '*.la'

modules:
  - name: supershot
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release --verbose
      - ./scripts/install.sh / /app
    sources:
      - type: dir
        path: .
      - cargo-sources.json
